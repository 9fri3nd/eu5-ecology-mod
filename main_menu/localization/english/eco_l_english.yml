l_english:
 # Game rules
 eco_rule:0 "Ecology Simulation"
 eco_rule_desc:0 "Enables the ecology simulation: per-province temperature, humidity, growing degree days and soil erosion, updating every month."
 eco_rule_enabled:0 "Enabled"
 eco_rule_enabled_desc:0 "Provinces simulate climate and soil every month. Crop output, food, attrition and raw material production are affected."
 eco_rule_disabled:0 "Disabled"
 eco_rule_disabled_desc:0 "The ecology simulation is turned off. Provinces receive no ecological modifiers."

 # Modifier types (display markers)
 MODIFIER_TYPE_NAME_eco_temperature:0 "Temperature"
 MODIFIER_TYPE_DESC_eco_temperature:0 "Current average temperature in this province this month."
 MODIFIER_TYPE_NAME_eco_gdd:0 "Growing Degree Days"
 MODIFIER_TYPE_DESC_eco_gdd:0 "Accumulated growing degree days this year. Crops need warmth to grow; higher values mean a more productive growing season."
 MODIFIER_TYPE_NAME_eco_humidity:0 "Humidity"
 MODIFIER_TYPE_DESC_eco_humidity:0 "Current moisture level in this province. Affects food spoilage, disease and rice cultivation."
 MODIFIER_TYPE_NAME_eco_soil_health:0 "Soil Health"
 MODIFIER_TYPE_DESC_eco_soil_health:0 "Current health of the soil in this province. Eroded soil supports less farming, fewer raw materials and fewer people."

 # Display carriers
 eco_metric_temperature:0 "Current Temperature"
 eco_metric_temperature_desc:0 "The average temperature in this province this month, driven by its climate, season and hemisphere."
 eco_metric_gdd:0 "Growing Degree Days"
 eco_metric_gdd_desc:0 "Growing degree days accumulated so far this year. Crops grow only while the weather is warm enough."
 eco_metric_humidity:0 "Current Humidity"
 eco_metric_humidity_desc:0 "The current moisture level of this province, shaped by climate, coasts, rivers and the season."
 eco_metric_soil_health:0 "Soil Health"
 eco_metric_soil_health_desc:0 "The current health of the soil, worn down by erosion and land use, and slowly regenerated under vegetation cover."
 eco_soil_capacity:0 "Soil Food Capacity"
 eco_soil_capacity_desc:0 "Healthy soil increases how much food this province can store; depleted soil reduces it."

 # GDD tiers
 eco_gdd_tier_dormant:0 "Dormant Growing Season"
 eco_gdd_tier_dormant_desc:0 "Far too cold for crops. The growing season never really started, and fields lie dormant."
 eco_gdd_tier_poor:0 "Poor Growing Season"
 eco_gdd_tier_poor_desc:0 "A short, cold growing season. Crops struggle to ripen before the frost returns."
 eco_gdd_tier_adequate:0 "Adequate Growing Season"
 eco_gdd_tier_adequate_desc:0 "The growing season is barely long enough. Harvests are modest and unreliable."
 eco_gdd_tier_good:0 "Good Growing Season"
 eco_gdd_tier_good_desc:0 "A warm and generous growing season. Crops ripen well and harvests are plentiful."
 eco_gdd_tier_ideal:0 "Ideal Growing Season"
 eco_gdd_tier_ideal_desc:0 "An exceptional growing season with abundant warmth. Fields yield bountiful harvests."

 # Soil tiers
 eco_soil_tier_depleted:0 "Depleted Soil"
 eco_soil_tier_depleted_desc:0 "The soil is exhausted and eroded. It yields little and can support only a sparse population."
 eco_soil_tier_poor:0 "Poor Soil"
 eco_soil_tier_poor_desc:0 "Worn-out soil that produces meagre yields and supports fewer people than it once did."
 eco_soil_tier_degraded:0 "Degraded Soil"
 eco_soil_tier_degraded_desc:0 "The soil is showing signs of wear. Raw material production is beginning to suffer."
 eco_soil_tier_healthy:0 "Healthy Soil"
 eco_soil_tier_healthy_desc:0 "Rich, well-kept soil that rewards those who work it."
 eco_soil_tier_rich:0 "Rich Soil"
 eco_soil_tier_rich_desc:0 "Deep, fertile soil. The land yields abundantly and can support a growing population."

 # Humidity tiers
 eco_humidity_tier_arid:0 "Arid Climate"
 eco_humidity_tier_arid_desc:0 "Very dry air. Food keeps well, but parched fields produce less."
 eco_humidity_tier_dry:0 "Dry Climate"
 eco_humidity_tier_dry_desc:0 "Dry conditions slow the spoiling of stored food."
 eco_humidity_tier_balanced:0 "Balanced Humidity"
 eco_humidity_tier_balanced_desc:0 "Neither too dry nor too wet. Ideal conditions for producing food."
 eco_humidity_tier_humid:0 "Humid Climate"
 eco_humidity_tier_humid_desc:0 "Damp air spoils food faster and helps disease spread."
 eco_humidity_tier_wet:0 "Wet Climate"
 eco_humidity_tier_wet_desc:0 "Oppressively wet conditions. Food rots quickly and disease thrives, though rice loves the water."

 # Temperature tiers
 eco_temp_tier_deep_frost:0 "Deep Frost"
 eco_temp_tier_deep_frost_desc:0 "Bitter, killing cold. Armies freeze, food production collapses and the population dwindles."
 eco_temp_tier_cold:0 "Cold Snap"
 eco_temp_tier_cold_desc:0 "Harsh cold. Armies suffer attrition and food production falters."
 eco_temp_tier_temperate:0 "Temperate Weather"
 eco_temp_tier_temperate_desc:0 "Mild and pleasant weather, kind to fields and farmers alike."
 eco_temp_tier_hot:0 "Hot Spell"
 eco_temp_tier_hot_desc:0 "Oppressive heat spoils food and slows work in the fields."
 eco_temp_tier_scorching:0 "Scorching Heat"
 eco_temp_tier_scorching_desc:0 "Unbearable heat. Armies wither, food rots in storage and harvests suffer."

 # Script value descriptions
 ECO_SV_SEASONAL:0 "Seasonal factor"
 ECO_SV_MEAN:0 "Annual mean"
 ECO_SV_AMPLITUDE:0 "Seasonal amplitude"
 ECO_SV_GDD:0 "Growing degree days"
 ECO_SV_MOISTURE:0 "Moisture"
 ECO_SV_EROSION:0 "Erosion"
 ECO_SV_REGEN:0 "Soil regeneration"
 ECO_SV_PRESSURE:0 "Land use pressure"
 ECO_SV_GEOGRAPHY:0 "Geography"
 ECO_SV_MONSOON:0 "Monsoon rains"
 ECO_SV_MED_WINTER:0 "Mediterranean winter rains"
 ECO_SV_MED_SUMMER:0 "Mediterranean summer drought"
 ECO_SV_CONT_SUMMER:0 "Continental summer rains"

