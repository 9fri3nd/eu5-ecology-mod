 # Ecology tab GUI
 ECO_GUI_BANNER_TITLE:0 "Seasonal Climate & Land Health"
 ECO_GUI_BANNER_DESC:0 "This province's climate and soil are simulated every month. Crops follow thermal and hydrological cues, not the calendar: frost-bound lands grow between thaw and freeze, Mediterranean lands rest in high summer, monsoon lands harvest twice a year, and equatorial lands grow perpetually. Land use erodes the soil, while depopulated land slowly recovers through fallow."
